<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="512" height="512" fill="#000000" rx="128"/>
  
  <!-- Glowing background radial burst -->
  <circle cx="256" cy="256" r="220" fill="url(#auraGlow)"/>
  
  <!-- Stylized Hourglass / Aura A Frame -->
  <g filter="url(#glowEffect)">
    <!-- Outer Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonGradient)" stroke-width="12" stroke-opacity="0.8"/>
    
    <!-- Minimalist Digital Clock face ticks -->
    <line x1="256" y1="110" x2="256" y2="130" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="382" x2="256" y2="402" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="256" x2="130" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="382" y1="256" x2="402" y2="256" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Styled Logo A / Clock hands -->
    <path d="M 256,160 L 330,330 L 182,330 Z" fill="none" stroke="url(#neonGradient)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="16" fill="#ffffff"/>
  </g>
</svg>
